spring.application.name=smart-clinic

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smart_clinic?useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8084

# JWT Configuration
jwt.secret=${JWT_SECRET:SmartClinicDemoSecretKeyForJwtSigning123456789}
jwt.expiration=86400000