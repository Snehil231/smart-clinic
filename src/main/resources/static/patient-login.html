<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Login - Smart Clinic</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1f2937;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            color: #0f766e;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        h2 {
            color: #0f766e;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #0f766e;
            box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #0f766e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .login-btn:hover {
            background: #115e59;
        }

        .login-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
            min-height: 20px;
        }

        .demo-box {
            margin-top: 25px;
            padding: 15px;
            background: #f0fdfa;
            border-radius: 8px;
            border: 1px solid #ccfbf1;
        }

        .demo-box h3 {
            color: #115e59;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .demo-box p {
            color: #475569;
            font-size: 14px;
            margin: 4px 0;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #0f766e;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


    <div class="login-container">

        <div class="login-card">


            <div class="logo">
                Smart Clinic
            </div>

            <div class="subtitle">
                Patient Portal
            </div>


            <h2>Patient Login</h2>


            <form id="loginForm">


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="patient@smartclinic.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                    id="loginButton"
                >
                    Login as Patient
                </button>


            </form>


            <div id="message"></div>


            <div class="demo-box">

                <h3>Demo Patient Account</h3>

                <p>
                    <strong>Email:</strong>
                    snehil@smartclinic.com
                </p>

                <p>
                    <strong>Password:</strong>
                    patient123
                </p>

            </div>


            <a
                href="index.html"
                class="back-link"
            >
                ← Back to Smart Clinic
            </a>


        </div>

    </div>


    <script>


        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const message =
                        document
                            .getElementById("message");


                    const loginButton =
                        document
                            .getElementById("loginButton");


                    message.textContent = "";
                    message.style.color = "";


                    loginButton.disabled = true;

                    loginButton.textContent =
                        "Logging in...";


                    try {

                        const response =
                            await fetch(
                                "/api/patients/login",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            email: email,
                                            password: password
                                        })
                                }
                            );


                        const data =
                            await response.json();


                        if (
                            response.ok &&
                            data.success
                        ) {

                            localStorage.setItem(
                                "patientToken",
                                data.data.token
                            );


                            localStorage.setItem(
                                "patientEmail",
                                data.data.email
                            );


                            window.location.href =
                                "patient-dashboard.html";

                        } else {

                            message.style.color =
                                "#dc2626";

                            message.textContent =
                                data.message ||
                                "Invalid patient credentials.";

                        }


                    } catch (error) {

                        console.error(
                            "Patient login error:",
                            error
                        );


                        message.style.color =
                            "#dc2626";

                        message.textContent =
                            "Server connection failed. Make sure Spring Boot is running.";

                    }


                    finally {

                        loginButton.disabled =
                            false;

                        loginButton.textContent =
                            "Login as Patient";

                    }

                }
            );


    </script>


</body>

</html>
